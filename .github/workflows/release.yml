name: Build installable release
on:
  push:
    tags: ['v[0-9]*']
    branches: ['feat/unified-entry']
permissions:
  contents: write
  packages: write
concurrency:
  group: mfconnect-container-publication
  cancel-in-progress: false
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check public source and tests
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx python3-cryptography jq
          python3 scripts/check_publication.py --ref HEAD
          python3 scripts/test_publication.py
          python3 scripts/test_compose_installer.py
          python3 scripts/test_unified_deployment.py
          go test -race ./internal/... ./cmd/...
      - name: Build binaries, plugin and image
        run: |
          make build frp
          python3 scripts/package_plugin.py --binary dist/mfconnectd --frpc dist/tools/frpc --frp-license dist/tools/FRP-LICENSE --release-base https://downloads.example.invalid/mfconnect --output dist/installer-plugin
          server_version=$(dist/mfconnect-server version)
          docker build -t "mfconnect-server:${server_version}-docker.1" .
          python3 scripts/package_gateway.py --plugin-dir dist/installer-plugin
          docker build -t "mfconnect-gateway:${server_version}" dist/gateway-context
      - name: Verify native ingress and legacy compatibility
        run: |
          python3 scripts/run_ci_check.py env MF_TEST_SERVER="$PWD/dist/mfconnect-server" MF_TEST_NGINX=/usr/sbin/nginx python3 scripts/test_unified_deployment.py --native
      - name: Verify existing Docker deployment
        run: sudo --preserve-env=GITHUB_STEP_SUMMARY python3 scripts/run_ci_check.py python3 scripts/test_cloud_container.py --release-dir "$PWD" --work-dir /tmp/mfconnect-release-container-test
      - name: Verify Docker and Compose deployments
        run: sudo --preserve-env=GITHUB_STEP_SUMMARY python3 scripts/run_ci_check.py python3 scripts/test_compose_stack.py
      - name: Publish tested container images
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_images.py
      - name: Package registry deployment and offline images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          server_version=$(dist/mfconnect-server version)
          test "$GITHUB_REF_NAME" = "v$server_version"
          server_image="ghcr.io/chashaochang/mfconnect-server:${server_version}-docker.1"
          gateway_image="ghcr.io/chashaochang/mfconnect-gateway:${server_version}"
          docker save "$server_image" "$gateway_image" | gzip -n > dist/images.tar.gz
          server_id=$(docker image inspect --format '{{.Id}}' "$server_image")
          gateway_id=$(docker image inspect --format '{{.Id}}' "$gateway_image")
          python3 scripts/package_release.py --version "$server_version" --images dist/images.tar.gz --server-image-id "$server_id" --gateway-image-id "$gateway_id" --output dist/release
      - name: Publish immutable release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '支持普通 Docker 和 Docker Compose，使用 GHCR 公开镜像；提供交互配置向导和离线镜像包。默认使用已有证书，无云账号要求；可选 DNS 自动签证。云端、网关、证书管理和插件均在容器内，宿主机无需安装其他服务。' > /tmp/release-notes.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "MF Connect $GITHUB_REF_NAME" --notes-file /tmp/release-notes.txt dist/release/mfconnect-*.tar.gz dist/release/SHA256SUMS dist/release/bundle.json
